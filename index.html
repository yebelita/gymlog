<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<title>GymLog</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--s1:#181b22;--s2:#232733;--s3:#30364480;--s3s:#323847;--tx:#eef0f5;--mu:#9aa1b2;--ok:#34d399;--okd:#0e3a2b;--pr:#fbbf24;--prd:#3d2f05;--ac:#60a5fa;--dan:#f87171;--nav:60px;--panelH:280px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:var(--s2);border:0;border-radius:14px;min-height:48px;padding:0 16px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.3)}
.btn-ok{background:var(--ok);color:#04130d;font-weight:700}
.btn-ac{background:var(--ac);color:#06121f;font-weight:700}
.btn-dan{background:transparent;color:var(--dan);border:1px solid #6b2f2f}
.btn-ghost{background:transparent;color:var(--mu)}
.wide{width:100%}
main{padding:12px 16px 24px;max-width:640px;margin:0 auto}
h1{font-size:26px;margin:8px 0 14px}
h2{font-size:15px;margin:22px 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--s1);border-radius:18px;padding:14px;margin-bottom:12px}
.muted{color:var(--mu)} .small{font-size:14px}
.row2{display:flex;gap:10px} .row2>*{flex:1;min-width:0}
.mt{margin-top:10px}
.tag{font-size:12px;background:var(--s2);color:var(--mu);border-radius:99px;padding:2px 8px;font-weight:500;vertical-align:middle}
.prb{font-size:12px;background:var(--prd);color:var(--pr);border-radius:99px;padding:2px 8px;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:40px 16px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:#12151c;border-top:1px solid #232733;z-index:20}
#nav button{flex:1;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mu);min-height:var(--nav);padding:0}
#nav button.on{color:var(--ok)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* home */
.hero{background:linear-gradient(135deg,#123d2e,#181b22 70%);border-radius:22px;padding:18px;margin-bottom:8px}
.hero .k{color:var(--ok);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hero .d{font-size:25px;font-weight:800;margin:4px 0}
.hero button{margin-top:16px;width:100%;min-height:68px;font-size:21px}
.day{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;margin-bottom:8px;min-height:62px;background:var(--s1);padding:10px 16px}
.day small{color:var(--mu)}
.nudge{border:1px solid #5b4a12;background:#221c08}

/* session */
.s-head{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid #1f232c}
.s-head .t{flex:1;min-width:0}
.s-head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-head .t span{font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.s-list{padding:12px 12px calc(var(--panelH) + 12px);max-width:640px;margin:0 auto}
.ex{background:var(--s1);border-radius:16px;margin-bottom:10px;border:2px solid transparent;scroll-margin:76px 0 calc(var(--panelH) + var(--nav) + 12px)}
.ex.on{border-color:var(--ok)}
.ex-h{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:58px;cursor:pointer}
.ex-h .n{flex:1;min-width:0;font-weight:600}
.ex-h .n small{display:block;font-weight:400;color:var(--mu);font-size:14px;margin-top:2px}
.badge{font-size:14px;background:var(--s2);border-radius:99px;padding:4px 10px;color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.full{background:var(--okd);color:var(--ok)}
.last{padding:0 14px 4px;font-size:14px;color:var(--mu)}
.sets{padding:0 10px 10px}
.set{display:flex;align-items:center;width:100%;gap:10px;text-align:left;background:var(--s2);margin-top:6px;min-height:50px;border-radius:12px;padding:0 14px;font-variant-numeric:tabular-nums}
.set .i{color:var(--mu);width:20px}
.set .v{flex:1;font-size:18px}
.set .ck{width:20px;text-align:center;color:var(--ok);font-weight:800}
.set.done{background:var(--okd)}
.set.sel{outline:2px solid var(--ac);outline-offset:-2px}
.ex-f{display:flex;gap:8px;padding:0 10px 12px}
.ex-f button{flex:1;font-size:15px;padding:0 8px}
.chips{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;background:var(--s2);border-radius:8px;padding:3px 8px;color:var(--mu);font-variant-numeric:tabular-nums}
.chip.d{background:var(--okd);color:var(--ok)}

/* panel */
.panel{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:#151922;border-top:1px solid #2a2f3b;border-radius:20px 20px 0 0;padding:10px 12px 12px;z-index:10;box-shadow:0 -10px 30px #000a;max-width:640px;margin:0 auto}
.p-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px 8px;font-size:15px}
.p-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title span{white-space:nowrap}
.ctrls{display:flex;gap:10px}
.ctl{flex:1;min-width:0;background:var(--s1);border-radius:16px;padding:6px}
.ctl label{display:block;font-size:12px;color:var(--mu);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.ctl .val{display:block;width:100%;background:none;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;min-height:46px;padding:0;line-height:46px}
.pm{display:flex;gap:6px}
.pm button{flex:1;height:58px;padding:0;font-size:30px;font-weight:600;border-radius:14px;background:var(--s3s)}
.confirm{margin-top:10px;width:100%;min-height:64px;font-size:20px}
.timer{display:flex;align-items:center;gap:6px;margin-bottom:10px;background:var(--s1);border-radius:14px;padding:4px 4px 4px 14px;position:relative;overflow:hidden}
.timer[hidden]{display:none}
.timer .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--ac);transition:width .25s linear}
.timer .tt{flex:1;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.timer .tt small{font-size:13px;color:var(--mu);font-weight:500;margin-right:6px}
.timer button{min-height:48px;padding:0 12px;font-size:15px}
.timer.end{background:var(--okd)} .timer.end .tt{color:var(--ok);font-size:20px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:2px 0 14px;font-size:21px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14px;color:var(--mu);margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;min-height:52px;background:var(--s2);color:var(--tx);border:1px solid #3a4050;border-radius:12px;padding:0 14px;font:inherit;font-size:18px}
input.big{font-size:32px;font-weight:700;text-align:center;min-height:64px}
.list-btn{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:54px}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;min-height:46px;color:var(--mu);padding:0 6px;font-size:15px}
.seg button.on{background:var(--s3s);color:var(--tx);font-weight:700}
.tg{display:flex;width:100%;justify-content:space-between;align-items:center;margin-bottom:8px;min-height:56px;background:var(--s1);text-align:left}
.tg i{font-style:normal;font-size:14px;font-weight:700;border-radius:99px;padding:5px 12px;background:var(--s2);color:var(--mu)}
.tg i.on{background:var(--okd);color:var(--ok)}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:14px;padding:4px 4px 4px 16px;margin-bottom:8px;min-height:56px}
.stp div{display:flex;align-items:center;gap:6px}
.stp b{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.stp button{width:52px;padding:0;font-size:22px}

/* history / progress */
.hist{display:block;width:100%;text-align:left;background:var(--s1);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.hist .top{display:flex;justify-content:space-between;gap:8px}
.hist .top b{font-size:16px}
.det-ex{margin-bottom:14px}
.det-ex b{display:block;margin-bottom:4px}
.tiles{display:flex;gap:8px;margin:12px 0}
.tile{flex:1;background:var(--s1);border-radius:14px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.tile b{display:block;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.pr b{color:var(--pr)}
.chart{background:var(--s1);border-radius:16px;padding:8px 4px 4px}
.chart svg{display:block;width:100%;height:auto}
.plist div{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid #222631;font-variant-numeric:tabular-nums}

/* editor */
.er{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:12px;margin-top:6px;padding-left:12px}
.er .nm{flex:1;min-width:0;padding:8px 0;cursor:pointer}
.er .nm small{display:block;color:var(--mu);font-size:13px}
.er button{background:none;width:44px;padding:0;color:var(--mu);font-size:18px}
.dh{display:flex;align-items:center;gap:4px}
.dh .nm{flex:1;min-width:0;cursor:pointer;padding:6px 0}
.dh button{background:none;width:44px;padding:0;color:var(--mu);font-size:18px}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));background:#2b3140;padding:12px 18px;border-radius:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center;box-shadow:0 6px 20px #0008}
#toast.show{opacity:1}
#toast.pr{background:var(--prd);color:var(--pr);font-weight:700;font-size:19px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-a="go" data-v="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Entrenar</button>
  <button data-a="go" data-v="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
  <button data-a="go" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M5 15l4-4 3 3 6-7"/></svg>Progreso</button>
  <button data-a="go" data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div id="sheetRoot"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';
/* ============ utilidades ============ */
const KEY = 'gymlog.v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n * 100) / 100;
const fmtN = n => String(r2(+n || 0)).replace('.', ',');
const fmtBig = n => Math.round(n).toLocaleString('es-ES');
const fmtT = s => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60), r = s % 60; return m ? (r ? `${m}:${String(r).padStart(2, '0')} min` : `${m} min`) : `${r} s`; };
const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtRest = s => s >= 60 ? (s % 60 ? fmtClock(s) + ' min' : s / 60 + ' min') : s + ' s';
const fmtDur = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
const fmtElapsed = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MON = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtDate = ts => { const d = new Date(ts); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = ts => { const d = new Date(ts); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const ago = ts => { const a = new Date(ts), b = new Date(); a.setHours(0,0,0,0); b.setHours(0,0,0,0); const n = Math.round((b - a) / 864e5); return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} días`; };
const norm = s => String(s || '').trim().toLowerCase();
const parseNum = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) ? n : NaN; };
const firstNum = s => { const m = String(s || '').match(/\d+(?:[.,]\d+)?/); return m ? parseNum(m[0]) : 0; };

/* ============ rutina por defecto (de Rutina.txt) ============ */
const E = (name, sets, reps, rest, o = {}) => ({ id: uid(), name, sets, reps, rest, mode: 'peso', step: 2.5, optional: false, ...o });
function defaultRoutine() {
  return [
    { id: uid(), name: 'Glúteos (fuerza)', exercises: [
      E('Hip thrust con barra', 5, '5-6', 180),
      E('Peso muerto rumano con barra', 4, '6-8', 180),
      E('Búlgaras', 3, '8-10 por pierna', 120),
      E('Abducción en máquina', 3, '12-15', 60)] },
    { id: uid(), name: 'Espalda (densidad)', exercises: [
      E('Remo con barra inclinado', 3, '6-8', 180),
      E('Jalón al pecho, agarre neutro', 4, '8-10', 120),
      E('Remo en polea', 3, '10-12', 120),
      E('Remo pecho apoyado o con mancuerna', 3, '10-12', 90),
      E('Pullover en polea', 3, '12', 90),
      E('Face pull', 3, '15', 60),
      E('Reverse fly en máquina', 3, '12-15', 60),
      E('Curl martillo', 2, '12', 90, { step: 1, optional: true })] },
    { id: uid(), name: 'Pierna (cuádriceps)', exercises: [
      E('Hack', 3, '8-10', 120),
      E('Prensa', 3, '8-10', 180),
      E('Extensión de cuádriceps', 3, '10-12', 90),
      E('Curl femoral', 3, '8-12', 90),
      E('Aductor', 3, '12', 90)] },
    { id: uid(), name: 'Recuperación activa', exercises: [
      E('Caminata inclinada', 1, '20-30 min', 0, { mode: 'tiempo' }),
      E('Plancha', 3, '45-60 s', 60, { mode: 'tiempo' }),
      E('Pallof Press', 3, '12', 60, { step: 1 }),
      E('Dead Bug', 3, '12', 60, { mode: 'reps' }),
      E('Movilidad', 1, '10 min', 0, { mode: 'tiempo' })] },
    { id: uid(), name: 'Glúteos (hipertrofia)', exercises: [
      E('Hip thrust (pausa de 1 s arriba)', 4, '8-10', 120),
      E('Step-up', 3, '10', 120),
      E('Peso muerto rumano unilateral', 3, '10', 120),
      E('Patada en polea', 3, '12-15', 60, { step: 1 }),
      E('Abducción en máquina', 3, '15-20', 60)] },
    { id: uid(), name: 'Tren superior (espalda y hombros)', exercises: [
      E('Jalón al pecho o dominadas asistidas', 4, '8-10', 120),
      E('Remo en cable', 3, '10-12', 120),
      E('Press militar', 3, '8', 120),
      E('Press banca con mancuernas', 3, '8-10', 120),
      E('Elevaciones laterales', 3, '15', 60, { step: 1 }),
      E('Face pull', 3, '15', 60),
      E('Curl de bíceps', 2, '12', 60, { step: 1 }),
      E('Extensión de tríceps', 2, '12', 60, { step: 1 })] }
  ];
}

/* ============ estado y almacenamiento ============ */
const DEF_SETTINGS = { timerOn: true, useExRest: true, restDefault: 90, vibrate: true, sound: true, notify: true };
function blank() { return { v: 1, routine: defaultRoutine(), sessions: [], settings: { ...DEF_SETTINGS }, active: null, lastExport: 0 }; }
function migrate(d) {
  d.v = 1;
  d.settings = { ...DEF_SETTINGS, ...(d.settings || {}) };
  if (!Array.isArray(d.routine)) d.routine = defaultRoutine();
  if (!Array.isArray(d.sessions)) d.sessions = [];
  d.sessions.sort((a, b) => a.start - b.start);
  d.active = d.active || null;
  d.lastExport = d.lastExport || 0;
  return d;
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && typeof d === 'object') return migrate(d); } catch (e) {}
  return blank();
}
let S = load();
function save() {
  clearTimeout(saveT);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ No se pudo guardar: ' + e.message); }
}
let saveT;
const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(save, 400); };
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

let persisted = null;
async function askPersist() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      persisted = await navigator.storage.persisted();
      if (!persisted) persisted = await navigator.storage.persist();
    }
  } catch (e) {}
}

/* ============ consultas de historial ============ */
function setsOf(session, name) {
  const k = norm(name);
  return session.exercises.filter(x => norm(x.name) === k).flatMap(x => x.sets);
}
function lastPerf(name) {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const sets = setsOf(S.sessions[i], name);
    if (sets.length) return { date: S.sessions[i].start, sets };
  }
  return null;
}
function bests(name, extra = []) {
  const b = { n: 0, maxW: -1, repsAtMax: 0, maxR: 0, maxT: 0 };
  const all = S.sessions.flatMap(s => setsOf(s, name)).concat(extra);
  for (const st of all) {
    b.n++;
    const w = st.w || 0, r = st.r || 0;
    if (w > b.maxW) { b.maxW = w; b.repsAtMax = r; } else if (w === b.maxW && r > b.repsAtMax) b.repsAtMax = r;
    if (r > b.maxR) b.maxR = r;
    if ((st.t || 0) > b.maxT) b.maxT = st.t;
  }
  return b;
}
function prType(mode, st, b) {
  if (!b.n) return null;
  if (mode === 'peso') {
    if (!st.w) return st.r > b.maxR && b.maxW <= 0 ? 'reps' : null;
    if (st.w > b.maxW) return 'peso';
    if (st.w === b.maxW && st.r > b.repsAtMax) return 'reps';
    return null;
  }
  if (mode === 'reps') return st.r > b.maxR ? 'reps' : null;
  if (mode === 'tiempo') return st.t > b.maxT ? 'tiempo' : null;
  return null;
}
function setLabel(mode, st) {
  if (mode === 'tiempo') return fmtT(st.t);
  if (mode === 'reps') return `${st.r} reps`;
  return `${fmtN(st.w)} kg × ${st.r}`;
}
function setShort(mode, st) {
  if (mode === 'tiempo') return fmtT(st.t);
  if (mode === 'reps') return `${st.r}`;
  return `${fmtN(st.w)}×${st.r}`;
}
function suggestedDay() {
  const days = S.routine;
  if (!days.length) return null;
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const idx = days.findIndex(d => d.id === S.sessions[i].dayId);
    if (idx >= 0) return days[(idx + 1) % days.length];
  }
  return days[0];
}
const lastOfDay = id => { for (let i = S.sessions.length - 1; i >= 0; i--) if (S.sessions[i].dayId === id) return S.sessions[i]; return null; };
const dayLabel = d => `Día ${S.routine.indexOf(d) + 1} · ${d.name}`;
function allExerciseNames() {
  const map = new Map();
  S.routine.forEach(d => d.exercises.forEach(x => { if (!map.has(norm(x.name))) map.set(norm(x.name), { name: x.name, mode: x.mode }); }));
  S.sessions.forEach(s => s.exercises.forEach(x => { if (!map.has(norm(x.name))) map.set(norm(x.name), { name: x.name, mode: x.mode || 'peso' }); }));

  return null;
}

/* ============ sesión activa ============ */
function prefillSet(rx, last, i) {
  const mode = rx.mode || 'peso';
  const st = { w: 0, r: 0, t: 0, done: false, touched: false };
  const src = last ? last.sets[Math.min(i, last.sets.length - 1)] : null;
  if (src) { st.w = src.w || 0; st.r = src.r || 0; st.t = src.t || 0; }
  else if (mode === 'tiempo') st.t = (/min/i.test(rx.reps) ? firstNum(rx.reps) * 60 : firstNum(rx.reps)) || 60;
  else st.r = firstNum(rx.reps) || 10;
  st.pw = st.w;
  return st;
}
function mkSessEx(rx) {
  const last = lastPerf(rx.name);
  const n = Math.max(1, +rx.sets || (last ? last.sets.length : 3));
  const sets = [];
  for (let i = 0; i < n; i++) sets.push(prefillSet(rx, last, i));
  return { id: uid(), name: rx.name, mode: rx.mode || 'peso', step: +rx.step || 2.5, rest: rx.rest ?? null, target: rx.reps || '', optional: !!rx.optional, sets, hasHist: !!last };
}
function startSession(dayId) {
  const day = S.routine.find(d => d.id === dayId);
  S.active = { id: uid(), dayId: day ? day.id : null, dayName: day ? dayLabel(day) : 'Sesión libre', start: Date.now(), exercises: day ? day.exercises.map(mkSessEx) : [], cur: { e: 0, s: 0, manual: false }, timer: null };
  const nx = nextPending(0, -1);
  if (nx) S.active.cur = nx;
  save(); audio(); askPersist(); askNotify(); requestWake();
  view = 'train'; render(); scrollTo(0, 0);
  if (!day) openAddExercise();
}
function nextPending(fromE, fromS) {
  const ex = S.active.exercises, n = ex.length;
  if (ex[fromE]) for (let s = fromS + 1; s < ex[fromE].sets.length; s++) if (!ex[fromE].sets[s].done) return { e: fromE, s, manual: false };
  for (let k = 1; k <= n; k++) {
    const e = (fromE + k) % n;
    const s = ex[e].sets.findIndex(x => !x.done);
    if (s >= 0) return { e, s, manual: false };
  }
  return null;
}
const anyPending = () => S.active.exercises.some(e => e.sets.some(s => !s.done));
const curEx = () => S.active && S.active.exercises[S.active.cur.e];
const curSet = () => { const ex = curEx(); return ex && ex.sets[S.active.cur.s]; };

function restFor(ex) {
  const st = S.settings;
  if (st.useExRest && ex.rest !== null && ex.rest !== '' && ex.rest !== undefined) return +ex.rest;
  return st.restDefault;
}
function startRest(ex) {
  if (!S.settings.timerOn || !anyPending()) return;
  const sec = restFor(ex);
  if (!sec) return;
  S.active.timer = { end: Date.now() + sec * 1000, total: sec, fired: false };
  syncRest();
}
function propagate(ex, i) {
  const st = ex.sets[i];
  const changedW = st.w !== st.pw;
  for (let j = i + 1; j < ex.sets.length; j++) {
    const t = ex.sets[j];
    if (t.done || t.touched) continue;
    if (changedW || !ex.hasHist) { t.w = st.w; t.pw = st.w; }
    if (!ex.hasHist) { t.r = st.r; t.t = st.t; }
  }
}
function confirmSet() {
  const A = S.active, ex = curEx(), st = curSet();
  if (!st) return;
  audio();
  const wasDone = st.done;
  const others = ex.sets.filter((x, i) => x.done && i !== A.cur.s);
  st.pr = prType(ex.mode, st, bests(ex.name, others));
  st.done = true; st.at = Date.now();
  if (st.pr) toast(st.pr === 'peso' ? `🏆 ¡Récord! ${fmtN(st.w)} kg` : st.pr === 'tiempo' ? `🏆 ¡Récord! ${fmtT(st.t)}` : `🏆 ¡Récord! ${setLabel(ex.mode, st)}`, 'pr');
  buzz(st.pr ? [60, 60, 120] : 35);
  if (!wasDone) { propagate(ex, A.cur.s); startRest(ex); }
  const prevE = A.cur.e;
  const nx = nextPending(A.cur.e, A.cur.s);
  A.cur = nx || { e: A.cur.e, s: A.cur.s, manual: false };
  save(); render();
  if (A.cur.e !== prevE) { const el = $('#ex-' + A.cur.e); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}
function stepValue(code) {
  const ex = curEx(), st = curSet();
  if (!st) return;
  const k = code[0], sg = code.slice(-1) === '+' ? 1 : -1;
  if (k === 'w') st.w = Math.max(0, r2(st.w + sg * (ex.step || 2.5)));
  if (k === 'r') st.r = Math.max(0, st.r + sg);
  if (k === 't') { const stp = (st.t > 300 || (st.t === 300 && sg > 0)) ? 60 : 5; st.t = Math.max(0, st.t + sg * stp); }
  st.touched = true;

}
function refreshValues() {
  const A = S.active, ex = curEx(), st = curSet();
  if (!st) return;
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set('#vw', fmtN(st.w)); set('#vr', st.r); set('#vt', fmtT(st.t));
  set(`#row-${A.cur.e}-${A.cur.s} .v`, setLabel(ex.mode, st));
}
function finishSession(discard) {
  const A = S.active;
  if (!discard) {
    const exs = A.exercises.map(e => ({
      name: e.name, mode: e.mode,
      sets: e.sets.filter(s => s.done).map(s => {
        const o = e.mode === 'tiempo' ? { t: s.t } : e.mode === 'reps' ? { r: s.r } : { w: s.w, r: s.r };
        if (s.pr) o.pr = s.pr;
        return o;
      })
    })).filter(e => e.sets.length);
    if (exs.length) {
      S.sessions.push({ id: A.id, dayId: A.dayId, dayName: A.dayName, start: A.start, end: Date.now(), exercises: exs });
      S.sessions.sort((a, b) => a.start - b.start);

}

/* ============ temporizador, sonido, vibración, wake lock ============ */
let ac = null;
function audio() {
  try {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) {}
  return ac;
}
function beep() {
  const c = audio(); if (!c) return;
  const t0 = c.currentTime + 0.02;
  [0, 0.28, 0.56].forEach((d, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);
    o.connect(g).connect(c.destination); o.start(t0 + d); o.stop(t0 + d + 0.25);
  });
}
const buzz = p => { if (S.settings.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
function alarm() { buzz([300, 120, 300, 120, 500]); if (S.settings.sound) beep(); }

/* Aviso con la pantalla bloqueada. Al bloquear, el navegador congela los temporizadores y
   bloquea navigator.vibrate, así que durante el descanso se reproduce un audio inaudible que
   mantiene viva la página y, al terminar, se lanza una notificación del sistema (que sí vibra). */
let restTO = null, keep = null;
const canNotify = () => 'Notification' in window && 'serviceWorker' in navigator;
const notifyOn = () => S.settings.notify && canNotify() && Notification.permission === 'granted';
async function askNotify() {
  if (!S.settings.notify || !canNotify() || Notification.permission !== 'default') return;
  try { await Notification.requestPermission(); } catch (e) {}
  syncRest();
  if (view === 'settings') render();
}
function keepAlive(on) {
  if (!on) { if (keep) keep.pause(); return; }
  if (!keep) {
    // WAV de 1 s con amplitud mínima: no se oye, pero cuenta como audio en reproducción
    const n = 8000, b = new DataView(new ArrayBuffer(44 + n * 2));
    const w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
    b.setUint32(24, n, true); b.setUint32(28, n * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, 'data'); b.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) b.setInt16(44 + i * 2, i % 2 ? 1 : -1, true);
    keep = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
    keep.loop = true;
  }
  if (!keep.paused) return;
  keep.play().catch(() => {});
  if ('mediaSession' in navigator && window.MediaMetadata) try { navigator.mediaSession.metadata = new MediaMetadata({ title: 'Descanso en curso', artist: 'GymLog' }); } catch (e) {}
}
// Llamar siempre que cambie S.active.timer: programa el fin exacto y activa/desactiva el audio
function syncRest() {
  clearTimeout(restTO); restTO = null;
  const T = S.active && S.active.timer, on = !!(T && !T.fired);
  if (on) restTO = setTimeout(tick, Math.max(0, T.end - Date.now()) + 50);
  keepAlive(on && notifyOn());
}
async function notifyRest() {
  if (!notifyOn()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('Descanso terminado', { body: '¡A por la siguiente serie! 💪', icon: 'icon-192.png', badge: 'icon-192.png',
      tag: 'gymlog-rest', renotify: true, silent: false, ...(S.settings.vibrate ? { vibrate: [300, 120, 300, 120, 500] } : {}) });
  } catch (e) {}
}
function closeRestNote() {
  if (!canNotify() || !navigator.serviceWorker.controller) return;
  navigator.serviceWorker.ready.then(r => r.getNotifications({ tag: 'gymlog-rest' })).then(ns => ns.forEach(n => n.close())).catch(() => {});
}

function tick() {
  const A = S.active; if (!A) return;
  const el = $('#elapsed'); if (el) el.textContent = fmtElapsed(Date.now() - A.start);
  const T = A.timer; if (!T) return;
  const left = (T.end - Date.now()) / 1000;
  if (left <= 0 && !T.fired) {
    T.fired = true; T.firedAt = Date.now(); save(); syncRest();
    if (document.visibilityState === 'hidden') notifyRest();
    alarm();
  }

setInterval(tick, 250);
function timerHTML() {

    <button data-a="tadd" data-v="-15">−15</button><button data-a="tadd" data-v="15">+15</button><button data-a="tskip">Saltar</button><div class="bar" id="tbar"></div></div>`;
}

/* ---- progreso ---- */
function exHistory(name) {
  const out = [];
  for (const s of S.sessions) {
    const k = norm(name);
    const exs = s.exercises.filter(x => norm(x.name) === k);
    const sets = exs.flatMap(x => x.sets);
    if (!sets.length) continue;
    const mode = exs[0].mode || 'peso';
    let best = sets[0];
    sets.forEach(x => { if ((x.w || 0) > (best.w || 0) || ((x.w || 0) === (best.w || 0) && (x.r || 0) > (best.r || 0))) best = x; });
    out.push({ date: s.start, mode, sets, best,
      maxW: Math.max(...sets.map(x => x.w || 0)), vol: sets.reduce((a, x) => a + (x.w || 0) * (x.r || 0), 0),
      maxR: Math.max(...sets.map(x => x.r || 0)), totR: sets.reduce((a, x) => a + (x.r || 0), 0),
      maxT: Math.max(...sets.map(x => x.t || 0)), totT: sets.reduce((a, x) => a + (x.t || 0), 0) });
  }
  return out;
}
const METRICS = {
  peso: [['Peso máx', 'maxW', v => fmtN(v) + ' kg'], ['Volumen', 'vol', v => fmtBig(v) + ' kg']],
  reps: [['Reps máx', 'maxR', v => v + ' reps'], ['Reps totales', 'totR', v => v + ' reps']],
  tiempo: [['Tiempo máx', 'maxT', fmtT], ['Tiempo total', 'totT', fmtT]]
};
function renderProgress() {
  let h = '<main><h1>Progreso</h1>';
  const used = [];
  for (let i = S.sessions.length - 1; i >= 0; i--) S.sessions[i].exercises.forEach(e => { if (!used.some(u => norm(u) === norm(e.name))) used.push(e.name); });
  if (!used.length) return h + '<div class="empty">Cuando guardes sesiones verás aquí tu progreso por ejercicio.</div></main>';
  if (!progEx || !used.some(u => norm(u) === norm(progEx))) progEx = used[0];
  h += `<select data-ch="progEx">${used.map(u => `<option ${norm(u) === norm(progEx) ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>`;
  const hist = exHistory(progEx);
  const mode = hist[hist.length - 1].mode;
  const mets = METRICS[mode] || METRICS.peso;
  if (progMetric >= mets.length) progMetric = 0;
  const [, key, fmt] = mets[progMetric];
  h += `<div class="seg mt">${mets.map((m, i) => `<button data-a="metric" data-v="${i}" class="${i === progMetric ? 'on' : ''}">${m[0]}</button>`).join('')}</div>`;
  const maxIdx = hist.reduce((bi, x, i) => x[key] > hist[bi][key] ? i : bi, 0);
  const rec = hist[maxIdx], lastH = hist[hist.length - 1];
  let recTxt = fmt(rec[key]);
  if (mode === 'peso' && key === 'maxW') { const bb = bests(progEx); recTxt = `${fmtN(bb.maxW)} × ${bb.repsAtMax}`; }
  h += `<div class="tiles"><div class="tile pr"><span>🏆 Récord</span><b>${recTxt}</b><span>${fmtShort(rec.date)}</span></div>
    <div class="tile"><span>Última</span><b>${fmt(lastH[key])}</b><span>${fmtShort(lastH.date)}</span></div>
    <div class="tile"><span>Sesiones</span><b>${hist.length}</b><span>&nbsp;</span></div></div>`;
  h += `<div class="chart">${chartSVG(hist.map(x => ({ x: x.date, y: x[key] })), fmt)}</div><h2>Registros</h2><div class="plist">`;
  for (let i = hist.length - 1; i >= 0; i--) {
    const x = hist[i];
    h += `<div><span>${fmtShort(x.date)} <span class="muted small">${new Date(x.date).getFullYear()}</span></span><span>${x.sets.map(s => setShort(mode, s)).join(' · ')}</span></div>`;
  }
  return h + '</div></main>';
}
function chartSVG(pts, fmt) {
  const W = 340, H = 200, L = 8, R = 8, T = 22, B = 24;
  const ys = pts.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { const d = Math.max(1, Math.abs(hi) * 0.1); lo -= d; hi += d; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  const X = i => pts.length === 1 ? W / 2 : L + 6 + (W - L - R - 12) * i / (pts.length - 1);
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de progreso">`;
  [hi, (hi + lo) / 2, lo].forEach(v => { const y = Y(v); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#2a2f3b" stroke-width="1"/><text x="${L + 2}" y="${y - 4}" fill="#7c8496" font-size="11">${esc(fmt(Math.round(v * 10) / 10))}</text>`; });
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  if (pts.length > 1) s += `<polygon points="${X(0)},${H - B} ${line} ${X(pts.length - 1)},${H - B}" fill="#34d399" fill-opacity=".1"/><polyline points="${line}" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>`;
  let run = -Infinity;
  const rr = pts.length > 30 ? 2.5 : 4;
  pts.forEach((p, i) => { const pr = i > 0 && p.y > run; run = Math.max(run, p.y); s += `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${pr ? rr + 1.5 : rr}" fill="${pr ? '#fbbf24' : '#34d399'}" stroke="#181b22" stroke-width="1.5"/>`; });
  s += `<text x="${L + 2}" y="${H - 6}" fill="#7c8496" font-size="11">${fmtShort(pts[0].x)}</text>`;
  if (pts.length > 1) s += `<text x="${W - R - 2}" y="${H - 6}" fill="#7c8496" font-size="11" text-anchor="end">${fmtShort(pts[pts.length - 1].x)}</text>`;
  return s + '</svg>';
}

const backupName = () => { const d = new Date(); return `gymlog-respaldo-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`; };

}

    save(); render();
  },
  selSet: d => { S.active.cur = { e: +d.e, s: +d.s, manual: true }; save(); render(); },
  confirm: confirmSet,
  undo: () => { const st = curSet(); if (st) { st.done = false; st.pr = null; S.active.cur.manual = false; save(); render(); } },
  type: d => openTypeSheet(d.k),
  addSet: d => {
    const A = S.active, e = +d.e, ex = A.exercises[e];
    const src = ex.sets[ex.sets.length - 1];
    const st = src ? { w: src.w, r: src.r, t: src.t, done: false, touched: false, pw: src.w } : prefillSet(ex, lastPerf(ex.name), 0);
    ex.sets.push(st);
    const cs = curSet();
    if (A.cur.e !== e || !cs || cs.done) A.cur = { e, s: ex.sets.length - 1, manual: false };
    save(); render();
  },
  delSet: d => {
    const A = S.active, e = +d.e, ex = A.exercises[e];
    if (!ex.sets.length) return;
    let i = -1;
    for (let k = ex.sets.length - 1; k >= 0; k--) if (!ex.sets[k].done) { i = k; break; }
    const doDel = idx => {
      ex.sets.splice(idx, 1);
      if (A.cur.e === e) { if (A.cur.s >= ex.sets.length) A.cur.s = Math.max(0, ex.sets.length - 1); const p = ex.sets.findIndex(x => !x.done); if (p >= 0) A.cur = { e, s: p, manual: false }; }
      save(); render();
    };
    if (i >= 0) doDel(i);
    else ask('¿Quitar la última serie?', 'Ya está registrada; se perderá.', 'Quitar', () => doDel(ex.sets.length - 1), true);
  },
  delEx: d => {
    const A = S.active, e = +d.e, ex = A.exercises[e];
    const doDel = () => {
      A.exercises.splice(e, 1);
      if (A.cur.e >= e && A.cur.e > 0) A.cur.e--;
      const nx = A.exercises.length ? nextPending(Math.max(0, A.cur.e - 1), -1) : null;
      A.cur = nx || { e: Math.min(A.cur.e, Math.max(0, A.exercises.length - 1)), s: 0, manual: false };
      save(); render();
    };
    if (ex.sets.some(s => s.done)) ask(`¿Quitar «${ex.name}»?`, 'Tiene series registradas en esta sesión que se perderán.', 'Quitar', doDel, true);
    else doDel();
  },
  addEx: openAddExercise,
  tadd: d => { const T = S.active.timer; if (!T) return; if (T.fired) { T.fired = false; T.end = Date.now(); } T.end += +d.v * 1000; T.total = Math.max(T.total, (T.end - Date.now()) / 1000); if (T.end <= Date.now()) S.active.timer = null; save(); syncRest(); updateTimer(); },
  tskip: () => { S.active.timer = null; save(); syncRest(); updateTimer(); },
  finishAsk: () => {
    const A = S.active;
    let sets = 0, vol = 0, prs = 0, pend = 0;
    A.exercises.forEach(e => e.sets.forEach(s => { if (s.done) { sets++; vol += e.mode === 'peso' ? s.w * s.r : 0; if (s.pr) prs++; } else pend++; }));
    sheet(`<h3>Terminar sesión</h3><div class="tiles"><div class="tile"><span>Duración</span><b>${fmtDur(Date.now() - A.start)}</b></div><div class="tile"><span>Series</span><b>${sets}</b></div>
      <div class="tile ${prs ? 'pr' : ''}"><span>Récords</span><b>${prs}</b></div></div>
      ${vol ? `<p class="muted">Volumen total: <b>${fmtBig(vol)} kg</b></p>` : ''}${pend ? `<p class="muted small">${pend} series sin hacer no se guardarán.</p>` : ''}
      <button class="wide btn-ok confirm" id="ok">Guardar y terminar</button><button class="wide mt" id="cont">Seguir entrenando</button><button class="wide btn-dan mt" id="disc">Descartar sesión</button>`, bg => {
      bg.querySelector('#ok').onclick = () => finishSession(false);
      bg.querySelector('#cont').onclick = () => closeSheet();
      bg.querySelector('#disc').onclick = () => ask('¿Descartar la sesión?', 'No se guardará nada de hoy.', 'Descartar', () => finishSession(true), true);
    });
  },
  hist: d => openHistory(d.id),
  metric: d => { progMetric = +d.v; render(); },
  tog: d => { S.settings[d.k] = !S.settings[d.k]; save(); syncRest(); render(); if (d.k === 'notify') askNotify(); },
  restAdj: d => { S.settings.restDefault = Math.max(15, Math.min(600, S.settings.restDefault + +d.v)); save(); render(); },
  export: doExport,
  share: doShare,
  import: () => $('#importFile').click(),
  wipe: () => ask('¿Borrar TODO?', 'Se eliminarán historial, rutina y ajustes de este dispositivo. Exporta un respaldo antes si lo necesitas.', 'Borrar todo', () =>
    ask('¿Seguro del todo?', 'Esta acción no se puede deshacer.', 'Sí, borrar', () => { releaseWake(); S = blank(); syncRest(); save(); view = 'train'; render(); toast('Datos borrados'); }, true), true),
  editDay: d => editDay(+d.d),
  mvDay: d => { move(S.routine, +d.d, +d.v); save(); render(); },
  editEx: d => editEx(+d.d, +d.x),
  mvEx: d => { move(S.routine[+d.d].exercises, +d.x, +d.v); save(); render(); },
  addDay: () => { S.routine.push({ id: uid(), name: 'Nuevo día', exercises: [] }); save(); render(); editDay(S.routine.length - 1); },
  resetRoutine: () => ask('¿Restaurar la rutina original?', 'Tu rutina actual se reemplazará por la de Rutina.txt. El historial se conserva.', 'Restaurar', () => { S.routine = defaultRoutine(); save(); render(); }, true)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && ACT[el.dataset.a]) ACT[el.dataset.a](el.dataset, el, e);
});
document.addEventListener('change', e => {
  if (e.target.dataset.ch === 'progEx') { progEx = e.target.value; progMetric = 0; render(); }
});

/* botones +/− con repetición al mantener pulsado */
let rep = null;
const stopRep = () => { if (rep) { clearTimeout(rep); rep = null; } };
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-step]'); if (!b) return;
  e.preventDefault(); stopRep();
  const code = b.dataset.step; let n = 0;
  stepValue(code); buzz(10);
  const loop = () => { stepValue(code); n++; rep = setTimeout(loop, n > 6 ? 60 : 130); };
  rep = setTimeout(loop, 450);
});
['pointerup', 'pointercancel', 'blur'].forEach(t => addEventListener(t, stopRep));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-step], .confirm')) e.preventDefault(); });

/* ============ arranque ============ */
render();
askPersist().then(() => { if (view === 'settings') render(); });
if (S.active) { requestWake(); syncRest(); }
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
